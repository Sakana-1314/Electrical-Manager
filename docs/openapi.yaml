openapi: 3.1.0
info:
  title: 电气车间备件管理系统
  version: 1.0.0
paths:
  /api/v1/auth/login:
    post:
      tags:
      - 认证
      summary: 登录
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJhZG1pbiIsInJvbGUiOiJTVVBFUl9BRE1JTiIsImV4cCI6MTc1Nzc2MDYwMH0.7Ql3Yk8mZ0dW1nXvT4bC2rP6sJ9aH5eF1uG0iO3kM8Q
                refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJhZG1pbiIsInJvbGUiOiJTVVBFUl9BRE1JTiIsImV4cCI6MTc1Nzc2MDYwMH0.7Ql3Yk8mZ0dW1nXvT4bC2rP6sJ9aH5eF1uG0iO3kM8Q
                token_type: bearer
                user:
                  id: 1
                  username: admin
                  display_name: 系统管理员
                  role: SUPER_ADMIN
                  enabled: true
                  version: 1
        '400':
          description: 业务校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: NOT_FOUND
                message: 二级库物资不存在
                details: {}
                request_id: 3e8bde7a-5efd-4970-a60e-3fc57a9f7654
        '401':
          description: 未认证或凭证无效
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: UNAUTHORIZED
                message: 请先登录
                details: {}
                request_id: 7a72e9dd-f00d-4735-a2bf-ff2718b5d3bc
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: FORBIDDEN
                message: 没有执行此操作的权限
                details: {}
                request_id: c14b4ca3-c239-4d97-a1ea-d2880f942054
        '409':
          description: 版本、状态或业务数据冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: VERSION_CONFLICT
                message: 数据已被其他用户修改，请刷新后重试
                details: {}
                request_id: fde9fdd5-0168-4a03-afd0-eb8ae0526629
        '422':
          description: 请求参数校验失败
