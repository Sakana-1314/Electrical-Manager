server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50m;

    # 文本类响应开启 gzip：入口 JS 约 450KB，压缩后约 140KB，弱网（车间 4G / 内网 VPN）首屏差距明显。
    # 接口 JSON 同样受益（列表页单页可达上百 KB）；图片本身已压缩，不在列表里。
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 构建产物文件名带内容哈希，内容变了文件名就变，可以长期强缓存。
    location ^~ /yangrucheng-assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 入口 HTML 必须每次协商：否则发版后浏览器仍用旧 index.html 引用已不存在的旧哈希资源（白屏）。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # public/ 下不带哈希的静态文件（logo、二维码）：可缓存但要能更新，不标 immutable。
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
