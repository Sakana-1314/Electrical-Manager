<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HXNI 电气无忧 · 电气车间业务管理系统" />
    <meta property="og:image" content="/Electrical-Manager/demo/logo.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/Electrical-Manager/demo/favicon-32.png" />
    <link rel="apple-touch-icon" href="/Electrical-Manager/demo/logo.png" />
    <title>HXNI 电气无忧</title>
    <script>
      /*
       * 首屏预置界面外观（自动 / 浅色 / 深色）：在样式与入口脚本执行前把解析结果写到 <html>，
       * 避免刷新或首访时先渲染浅色再跳深色的闪烁。
       *
       * 与 stores/theme.ts 保持一致：
       * - 本地键统一为 'theme.mode'，取值 auto / light / dark，缺省与非法值都按 auto 处理；
       * - auto 用 prefers-color-scheme 判断系统深浅色；
       * - 解析结果同时写 data-theme（styles.css 的令牌按它切换）与 color-scheme（滚动条、原生控件）。
       * 存储不可用（隐私模式）时静默按系统外观渲染，应用启动后 store 会再校正一次。
       */
      ;(function () {
        var mode = 'auto'
        try {
          mode = localStorage.getItem('theme.mode') || 'auto'
        } catch (e) {
          mode = 'auto'
        }
        if (mode !== 'light' && mode !== 'dark') {
          mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        var root = document.documentElement
        root.dataset.theme = mode
        root.style.colorScheme = mode
      })()
    </script>
    <script>
      /*
       * 单页应用在静态托管上的深链回退（只对演示产物生效）：
       * 业务构建不带 data-demo-base，本段直接 return，行为与之前完全一致。
       *
       * 刷新 /demo/.../warehouse/stock 这类深层路由时，静态托管找不到文件，会落到站点 404 页；
       * 404 页把原路径以 ?path= 回传到入口。本脚本在入口脚本执行前把它还原成真实路径，
       * 于是 history 路由照常工作——不改路由配置，也不改变正常访问时的 URL。
       */
      ;(function () {
        var base = document.documentElement.dataset.demoBase
        if (!base) return
        var url = new URL(window.location.href)
        var deep = url.searchParams.get('path')
        if (!deep) return
        var normalizedBase = base.replace(/\/+$/, '')
        if (deep.indexOf(normalizedBase) !== 0) return
        var rest = deep.slice(normalizedBase.length).replace(/^\/+/, '')
        url.searchParams.delete('path')
        var search = url.searchParams.toString()
        window.history.replaceState(
          null,
          '',
          normalizedBase + '/' + rest + (search ? '?' + search : '') + url.hash,
        )
      })()
    </script>
    <style>
      /* 启动占位：入口脚本下载 + 启动配置拉取期间显示，Vue mount 时整块被替换。
         只用内联样式与 data-theme（预置脚本已写入），不依赖 styles.css。 */
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f4f6fa;
        color: #7d8798;
        font: 13px/1.4 Inter, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      [data-theme='dark'] .boot-splash {
        background: #13171d;
        color: #8791a3;
      }
      .boot-splash__mark {
        width: 44px;
        height: 44px;
        object-fit: contain;
      }
      .boot-splash__bar {
        position: relative;
        width: 120px;
        height: 3px;
        overflow: hidden;
        border-radius: 3px;
        background: rgb(63 99 216 / 14%);
      }
      .boot-splash__bar::after {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: 3px;
        background: #3f63d8;
        animation: boot-splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-splash-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__bar::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
    <script type="module" crossorigin src="/Electrical-Manager/demo/yangrucheng-assets/index-CUYPwxSu.js"></script>
    <link rel="modulepreload" crossorigin href="/Electrical-Manager/demo/yangrucheng-assets/vendor-vue-Bmd4nGA4.js">
    <link rel="stylesheet" crossorigin href="/Electrical-Manager/demo/yangrucheng-assets/index-CJdVOtX3.css">
  </head>
  <body>
    <div id="app">
      <div class="boot-splash" role="status" aria-live="polite">
        <img class="boot-splash__mark" src="/Electrical-Manager/demo/logo-96.png" alt="" />
        <div class="boot-splash__bar"></div>
        <span>HXNI 电气无忧 · 正在加载</span>
      </div>
    </div>
  </body>
