name: electrical-manager

services:
  backend:
    image: ghcr.io/sakana-1314/electrical-manager:server
    restart: unless-stopped
    environment:
      APP_ENVIRONMENT: production
      APP_DATABASE_URL: ${APP_DATABASE_URL:?APP_DATABASE_URL must point to your external PostgreSQL service}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET must be configured}
      APP_ACCESS_TOKEN_MINUTES: ${APP_ACCESS_TOKEN_MINUTES:-480}
      APP_WECHAT_MINI_PROGRAM_APP_ID: ${APP_WECHAT_MINI_PROGRAM_APP_ID:-}
      APP_WECHAT_MINI_PROGRAM_APP_SECRET: ${APP_WECHAT_MINI_PROGRAM_APP_SECRET:-}
      APP_UPLOAD_DIR: /app/data/uploads
      APP_PREVIEW_CACHE_DIR: /app/data/preview-cache
      APP_LOG_DIR: /app/data/logs
    volumes:
      - uploads:/app/data/uploads
      - preview-cache:/app/data/preview-cache
      - logs:/app/data/logs
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "/app/server", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - 1panel-network

  frontend:
    image: ghcr.io/sakana-1314/electrical-manager:web
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - 1panel-network

volumes:
  uploads:
  preview-cache:
  logs:

networks:
  1panel-network:
    external: true
