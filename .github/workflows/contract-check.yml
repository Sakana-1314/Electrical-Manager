name: 契约一致性校验

on:
  push:
    branches: ["**"]
    paths:
      - "server/**"
      - "docs/**"
      - "web/**"
      - ".github/workflows/contract-check.yml"
  pull_request:
    paths:
      - "server/**"
      - "docs/**"
      - "web/**"
      - ".github/workflows/contract-check.yml"

permissions:
  contents: read

concurrency:
  # 发布引用（main / 标签）不取消进行中的运行：被取消的 check 会永久把该提交算作失败
  # （statusCheckRollup=FAILURE，提交列表和仓库首页显示红叉），而被顶掉的运行并不代表代码有问题。
  # 非发布引用（功能分支 / PR）继续取消旧运行，避免连续 push 反复占用 CI。
  group: contract-check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: 校验 openapi / generated.ts 未漂移
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: 安装后端依赖
        working-directory: server
        run: |
          pip install -e ".[dev]" || pip install -e .

      - name: 重新导出 openapi.yaml，校验与后端一致
        working-directory: server
        run: |
          python scripts/export_openapi.py
          cd ..
          if ! git diff --exit-code docs/openapi.yaml; then
            echo "❌ docs/openapi.yaml 与后端契约不一致。"
            echo "请在 server 目录运行：python scripts/export_openapi.py 并提交结果。"
            exit 1
          fi
          echo "✅ docs/openapi.yaml 与后端契约一致"

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装前端依赖
        working-directory: web
        run: npm ci

      - name: 重新生成 generated.raw.ts，校验与 openapi.yaml 一致
        working-directory: web
        run: |
          npx openapi-typescript ../docs/openapi.yaml -o src/api/generated.raw.ts
          if ! git diff --exit-code src/api/generated.raw.ts; then
            echo "❌ src/api/generated.raw.ts 与 docs/openapi.yaml 不一致。"
            echo "请在 web 目录运行：npm run generate:api 并提交结果。"
            exit 1
          fi
          echo "✅ src/api/generated.raw.ts 与 docs/openapi.yaml 一致"

      - name: 类型检查（generated.ts 引用映射是否仍成立）
        working-directory: web
        run: npx vue-tsc -b
