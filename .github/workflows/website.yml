name: 构建并发布项目站点

# 在 main 上构建 docs/websites 的 VitePress 站点，推送到 gh-pages 分支，由 GitHub Pages 发布。
# 站点地址：https://Sakana-1314.github.io/Electrical-Manager/
# PR 上只做构建校验（不发布），避免主题/插件/文档配置的问题合并到 main 后才暴露。
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "web/**"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "docs/**"
      - "web/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # 发布引用（main / 标签）不取消进行中的运行：被取消的 check 会永久把该提交算作失败
  # （statusCheckRollup=FAILURE，提交列表和仓库首页显示红叉），而被顶掉的运行并不代表代码有问题。
  # 非发布引用（功能分支 / PR）继续取消旧运行，避免连续 push 反复占用 CI。
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  # 构建到工作区目录之外，再以全新历史提交，避免把源码树带进 gh-pages。
  SITE_OUT_DIR: ${{ github.workspace }}/.site-dist

jobs:
  deploy:
    name: 构建并发布到 gh-pages
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            docs/websites/package-lock.json
            web/package-lock.json

      - name: 安装站点依赖
        working-directory: docs/websites
        run: npm ci

      - name: 构建站点
        working-directory: docs/websites
        run: npx vitepress build --outDir "$SITE_OUT_DIR"

      # 演示：同一份网页端代码，用 --mode demo 产出 base=/Electrical-Manager/demo/、
      # 后端直连 Apifox Mock 的产物（不装 service worker、不本地造假数据），
      # 复制进站点输出的 demo/ 子目录，于是与站点同域、可被 iframe 内嵌。
      # 业务部署（base=/）不受影响。
      - name: 安装网页端依赖（演示构建用）
        working-directory: web
        run: npm ci

      - name: 构建演示（直连 Apifox Mock）
        working-directory: web
        run: npx vite build --mode demo

      # 演示站要处理「深层路由被直接刷新」：站点 404 页把原路径回传，入口自带的引导脚本据此还原。
      # 标记名 data-demo-base 只在演示产物里出现；业务构建没有它，引导脚本直接 return，行为不变。
      - name: 给演示入口标记 base（启用深链回退）
        run: |
          set -e
          python3 - <<'PYEOF'
          import pathlib

          path = pathlib.Path("web/dist/index.html")
          html = path.read_text(encoding="utf-8")
          html = html.replace(
              "<html lang=\"zh-CN\">",
              '<html lang="zh-CN" data-demo-base="/Electrical-Manager/demo/">',
              1,
          )
          assert 'data-demo-base="/Electrical-Manager/demo/"' in html
          path.write_text(html, encoding="utf-8")
          print("演示入口已标记 data-demo-base")
          PYEOF

      - name: 把演示放进站点输出的 demo/
        run: |
          set -e
          rm -rf "$SITE_OUT_DIR/demo"
          cp -a web/dist "$SITE_OUT_DIR/demo"
          test -f "$SITE_OUT_DIR/demo/index.html"
          echo "demo/：$(find "$SITE_OUT_DIR/demo" -type f | wc -l) 个文件"

      # 站点与演示都是「index.html 引用带 hash 的资源」，hash 不匹配时页面会白屏而
      # 构建仍然成功（曾因此误判过线上状态）。这里在发布前把每个 HTML 引用的本地资源逐个校验。
      # 站点的二级 tab 是自定义组件，只认 <Tabs>/<TabsContent>；写成 VitePress 的 ::: tabs 容器语法
      # 不会报错，但会把内容当普通文本渲染出来（曾线上出现过）。这里做一次静态检查。
      # 站点 404 页由 VitePress 生成，而它会在 markdown 里剥掉 inline script，
      # 所以演示深链回退脚本注入在构建产物上。
      - name: 把演示深链回退脚本注入站点 404
        run: python3 "${{ github.workspace }}/docs/websites/scripts/inject_demo_fallback.py" "$SITE_OUT_DIR"

      - name: "校验文档没有用不支持的 ::: tabs 语法"
        run: |
          set -e
          if grep -rn --include='*.md' -E '^::: *tabs' docs/websites/pages/; then
            echo '❌ 请改用 Tabs 组件形式：<Tabs :tabs=[...]><TabsContent id=...></TabsContent></Tabs>' >&2
            exit 1
          fi
          echo "✅ 文档未使用 ::: tabs 语法"

      - name: 校验页面引用的资源都存在
        run: |
          set -e
          python3 - "$SITE_OUT_DIR" <<'PYEOF'
          import re, sys, pathlib
          root = pathlib.Path(sys.argv[1])

          def resolves(rel: str) -> bool:
              """按静态托管的解析顺序判断引用是否存在。

              - 直接命中文件（带 hash 的资源、图片等）
              - `foo` -> `foo.html`（站点开了 cleanUrls，链接不带 .html）
              - `foo/` -> `foo/index.html`
              """
              target = root / rel
              if target.is_file():
                  return True
              if not rel.endswith("/") and (root / f"{rel}.html").is_file():
                  return True
              if (target / "index.html").is_file():
                  return True
              return False

          missing, checked = [], 0
          for html in root.rglob("*.html"):
              text = html.read_text(encoding="utf-8", errors="ignore")
              for ref in re.findall(r'(?:src|href)="(/Electrical-Manager/[^"]*)"', text):
                  rel = ref[len("/Electrical-Manager/"):].split("?")[0].split("#")[0]
                  if not rel or rel.startswith("http"):
                      continue
                  checked += 1
                  if not resolves(rel):
                      missing.append(f"{html.relative_to(root)} -> {ref}")
          print(f"校验 {checked} 个站内引用，缺失 {len(missing)} 个")
          for item in sorted(set(missing))[:20]:
              print("  缺失:", item)
          if missing:
              raise SystemExit(1)
          PYEOF

      - name: 发布到 gh-pages 分支
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd "$SITE_OUT_DIR"
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          git commit -q -m "docs: 发布站点（${GITHUB_SHA::7}）"
          # gh-pages 只承载构建产物，每次整体替换。
          git push --force origin gh-pages
          echo "已发布到 gh-pages"
