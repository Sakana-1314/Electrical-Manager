name: 模拟用户操作测试

# 合并到 main 后：真实启动 PostgreSQL + 后端实例，通过 HTTP 模拟各角色用户的核心操作。
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "docs/references/database/**"
      - ".github/workflows/e2e-simulation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 发布引用（main / 标签）不取消进行中的运行：被取消的 check 会永久把该提交算作失败
  # （statusCheckRollup=FAILURE，提交列表和仓库首页显示红叉），而被顶掉的运行并不代表代码有问题。
  # 非发布引用（功能分支 / PR）继续取消旧运行，避免连续 push 反复占用 CI。
  group: e2e-simulation-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  e2e:
    name: 真实 PostgreSQL + 后端实例模拟请求
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spare_parts
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d spare_parts"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: 编译后端
        working-directory: server
        run: go build -o /tmp/spare-parts-server ./cmd/server

      - name: 配置 Python（模拟脚本）
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装模拟脚本依赖
        run: pip install httpx

      - name: 安装 PostgreSQL 客户端
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: 初始化数据库
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d spare_parts -v ON_ERROR_STOP=1 \
            -f docs/references/database/init.sql
          echo "数据库初始化完成"

      - name: 启动后端并运行模拟
        working-directory: server
        env:
          APP_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/spare_parts"
          APP_JWT_SECRET: "e2e-test-secret-that-is-long-enough-123456"
          APP_WECHAT_MINI_PROGRAM_APP_ID: "wx-test-primary,wx-test-secondary"
          APP_WECHAT_MINI_PROGRAM_APP_SECRET: "test-primary-secret,test-secondary-secret"
          APP_UPLOAD_DIR: "/tmp/e2e-uploads"
          APP_LOG_DIR: "/tmp/e2e-logs"
          APP_TEMPLATE_DIR: "${{ github.workspace }}/server/templates"
          APP_HOST: "127.0.0.1"
          APP_PORT: "8000"
          E2E_BASE_URL: "http://127.0.0.1:8000"
        run: |
          set -e
          /tmp/spare-parts-server > /tmp/server.log 2>&1 &
          BACKEND_PID=$!
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "后端就绪"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health > /dev/null
          python scripts/e2e_simulation.py
          kill "$BACKEND_PID" 2>/dev/null || true
