name: 基础接口测试

# 合并前的基础接口测试：使用内存 SQLite（无需 MySQL）跑完整后端测试套件。
on:
  push:
    branches: ["**"]
    paths:
      - "server/**"
      - ".github/workflows/api-test.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/api-test.yml"

permissions:
  contents: read

concurrency:
  # 发布引用（main / 标签）不取消进行中的运行：被取消的 check 会永久把该提交算作失败
  # （statusCheckRollup=FAILURE，提交列表和仓库首页显示红叉），而被顶掉的运行并不代表代码有问题。
  # 非发布引用（功能分支 / PR）继续取消旧运行，避免连续 push 反复占用 CI。
  group: api-test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: 后端接口测试（SQLite）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: 安装后端依赖
        working-directory: server
        run: pip install -e ".[dev]"

      - name: 运行测试
        working-directory: server
        run: pytest
