name: 基础接口测试

# 合并前的基础接口测试：使用内存 SQLite（无需 MySQL）跑完整后端测试套件。
#
# 触发方式拆成两条互不重叠的路径，同一个提交只跑一次：
#   - pull_request：唯一的「合并前」入口，跑 refs/pull/N/merge（PR 合入当时 main 的结果）。
#   - push 到 main：唯一的「合并后」入口，再叠一层「已测过就跳过」的去重判断（见下面 precheck）。
# 以前 push 还开了 branches: ["**"]，于是往 PR 分支 push 会同时命中 push 与 pull_request：
# 两者 ref 不同（refs/heads/x 与 refs/pull/N/merge）、concurrency 组也就不同，谁都不会取消谁，
# 同一个提交的同一套测试白跑一遍（实测 21 个 feature 分支 head 全部被跑了两遍）。
# 想在不建 PR 的情况下单独跑一次，用「手动触发」（workflow_dispatch）并选分支。
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/api-test.yml"
      - ".github/actions/tree-already-tested/**"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/api-test.yml"
      - ".github/actions/tree-already-tested/**"
  workflow_dispatch:

permissions:
  contents: read
  # 去重判断要反查「这个提交来自哪个 PR」和「那个 head 上有没有成功的 PR 运行」，两者都只读。
  pull-requests: read
  actions: read

concurrency:
  # push 现在只发生在 main，所以会被取消的只剩 PR 运行：连续往同一个 PR 推提交时取消旧的那次。
  # main 上的运行永不取消：被取消的 check 会永久把该提交算作失败
  # （statusCheckRollup=FAILURE，提交列表和仓库首页显示红叉），而被顶掉的运行并不代表代码有问题。
  group: api-test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # 合并到 main 后，如果这次合并出来的树已经由本 workflow 在 PR 上完整测过（逐字节相同），
  # 就不再重跑一遍。判断逻辑集中在 .github/actions/tree-already-tested。
  precheck:
    name: 检测本次合并是否只是在重复 PR 已跑过的测试
    # 只有 push 到 main 才需要判断；PR 上整块跳过，不额外占用 runner。
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 判断这棵树是否已经测过
        id: gate
        uses: ./.github/actions/tree-already-tested
        with:
          workflow-file: .github/workflows/api-test.yml

  test:
    name: 后端接口测试（SQLite）
    needs: precheck
    # always() 是兜底：precheck 被跳过（PR 运行）或它自己出错时必须照常跑，
    # 绝不能让「去重」这个优化本身变成漏测的原因。
    if: always() && needs.precheck.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: 安装后端依赖
        working-directory: server
        run: pip install -e ".[dev]"

      - name: 运行测试
        working-directory: server
        run: pytest
