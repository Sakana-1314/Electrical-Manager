name: 构建 Docker 镜像

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "server/**"
      - "web/**"
      - ".github/workflows/build-images.yml"
  pull_request:
    paths:
      - "server/**"
      - "web/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  # 推送到 GitHub Container Registry（ghcr.io）需要写 packages 权限，
  # 使用内置 GITHUB_TOKEN 即可，无需在仓库里配置用户名 / 密码。
  packages: write

concurrency:
  # 发布引用（main / 标签）不取消进行中的运行：被取消的 check 会永久把该提交算作失败
  # （statusCheckRollup=FAILURE，提交列表和仓库首页显示红叉），而被顶掉的运行并不代表代码有问题。
  # 非发布引用（功能分支 / PR）继续取消旧运行，避免连续 push 反复占用 CI。
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  # 镜像：ghcr.io/<owner 小写>/electrical-manager:<component>，owner 由 GITHUB_REPOSITORY_OWNER 推导。
  # 账号是 Sakana-1314，但 Docker/OCI 要求镜像名全小写（大写会被拒：repository name must be lowercase），
  # 所以下面有一步把 owner 转小写后再拼镜像名；仓库改名或转移后自动跟随。
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  # 仅 手动触发 / push 到 main / push v* 标签 时才推送镜像到 ghcr.io；
  # pull_request 事件一律只做构建测试，绝不推送。
  SHOULD_PUSH_IMAGE: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}

jobs:
  changes:
    name: 检测变更组件
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.set-components.outputs.components }}
    steps:
      - name: 检出代码（完整历史，供变更比对）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 检测服务端/网页端文件变更
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # 只输出 true/false，不列出具体文件
          list-files: none
          filters: |
            server:
              - 'server/**'
              - '.github/workflows/build-images.yml'
            web:
              - 'web/**'
              - '.github/workflows/build-images.yml'

      - name: 汇总需要构建的组件
        id: set-components
        run: |
          # 手动触发时固定构建前后端两个组件
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'components=["server","web"]' >> "$GITHUB_OUTPUT"
          else
            COMPONENTS="[]"
            if [ "${{ steps.filter.outputs.server }}" = "true" ]; then
              COMPONENTS="$(printf '%s' "$COMPONENTS" | jq -c '. + ["server"]')"
            fi
            if [ "${{ steps.filter.outputs.web }}" = "true" ]; then
              COMPONENTS="$(printf '%s' "$COMPONENTS" | jq -c '. + ["web"]')"
            fi
            echo "components=$COMPONENTS" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: 构建 ${{ matrix.component }} 镜像
    needs: changes
    if: needs.changes.outputs.components != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 生成构建信息
        id: buildinfo
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: 设置组件构建参数
        id: settings
        run: |
          if [ "${{ matrix.component }}" = "server" ]; then
            echo "context=./server" >> "$GITHUB_OUTPUT"
            echo "dockerfile=./server/Dockerfile" >> "$GITHUB_OUTPUT"
            echo "build_args<<EOF" >> "$GITHUB_OUTPUT"
            echo "BUILD_TIME=${{ steps.buildinfo.outputs.build_time }}" >> "$GITHUB_OUTPUT"
            echo "GIT_SHA=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.component }}" = "web" ]; then
            echo "context=./web" >> "$GITHUB_OUTPUT"
            echo "dockerfile=./web/Dockerfile" >> "$GITHUB_OUTPUT"
          fi

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        if: env.SHOULD_PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像命名空间（转小写）
        id: owner
        env:
          OWNER: ${{ env.IMAGE_NAMESPACE }}
        run: echo "name=${OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/electrical-manager
          tags: |
            type=raw,value=${{ matrix.component }},enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=${{ matrix.component }}-sha-
            type=ref,event=tag,prefix=${{ matrix.component }}-

      - name: 构建并按需推送镜像
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.settings.outputs.context }}
          file: ${{ steps.settings.outputs.dockerfile }}
          build-args: ${{ steps.settings.outputs.build_args }}
          push: ${{ env.SHOULD_PUSH_IMAGE == 'true' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: false
          sbom: false
