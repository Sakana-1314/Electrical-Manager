name: 契约文件自动同步

# docs/openapi.yaml 是手工维护的接口契约（唯一来源）。在 PR 上补齐缺失的示例、同步后端内嵌副本
# 并重新生成前端类型，自动提交回 PR 分支，保证合并前三者一致，便于下游对接。
on:
  pull_request:
    paths:
      - "server/**"
      - "docs/**"
      - "web/**"
      - ".github/workflows/sync-contract.yml"

permissions:
  contents: write

concurrency:
  group: sync-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: 同步 openapi 与前端类型
    runs-on: ubuntu-latest
    steps:
      - name: 检出 PR 分支
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 补齐契约示例并同步后端内嵌副本
        run: |
          pip install pyyaml
          python server/scripts/openapi_examples.py
          cp docs/openapi.yaml server/internal/openapi/openapi.yaml

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装前端依赖
        working-directory: web
        run: npm ci

      - name: 重新生成前端类型
        working-directory: web
        run: npm run generate:api

      - name: 提交契约文件变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/openapi.yaml server/internal/openapi/openapi.yaml web/src/api/generated.raw.ts
          if git diff --cached --quiet; then
            echo "契约文件无变化，无需提交"
          else
            git commit -m "chore: 自动同步 openapi 与前端类型"
            git push
          fi

      - name: 类型检查（generated.ts 引用映射是否仍成立）
        working-directory: web
        run: npx vue-tsc -b
