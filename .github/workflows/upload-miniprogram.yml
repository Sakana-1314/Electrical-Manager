name: 自动上传微信小程序代码

on:
  push:
    branches: [main]
    paths:
      - "miniprogram/**"
      - ".github/workflows/upload-miniprogram.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miniprogram-upload
  cancel-in-progress: false

jobs:
  upload:
    name: 检查并上传小程序
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miniprogram
    env:
      MINIPROGRAM_APPID: ${{ secrets.WECHAT_MINIPROGRAM_APPID }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: miniprogram/package-lock.json

      - name: 检查私密配置
        env:
          MINIPROGRAM_PRIVATE_KEY: ${{ secrets.WECHAT_MINIPROGRAM_PRIVATE_KEY }}
          MINIPROGRAM_APPID_2: ${{ secrets.WECHAT_MINIPROGRAM_APPID_2 }}
          MINIPROGRAM_PRIVATE_KEY_2: ${{ secrets.WECHAT_MINIPROGRAM_PRIVATE_KEY_2 }}
        run: |
          if [ -z "$MINIPROGRAM_APPID" ]; then
            echo "缺少 GitHub Secret：WECHAT_MINIPROGRAM_APPID"
            exit 1
          fi
          if [ -z "$MINIPROGRAM_PRIVATE_KEY" ]; then
            echo "缺少 GitHub Secret：WECHAT_MINIPROGRAM_PRIVATE_KEY"
            exit 1
          fi
          if [ -z "$MINIPROGRAM_APPID_2" ]; then
            echo "缺少 GitHub Secret：WECHAT_MINIPROGRAM_APPID_2"
            exit 1
          fi
          if [ -z "$MINIPROGRAM_PRIVATE_KEY_2" ]; then
            echo "缺少 GitHub Secret：WECHAT_MINIPROGRAM_PRIVATE_KEY_2"
            exit 1
          fi
          PRIVATE_KEY_PATH="$RUNNER_TEMP/miniprogram-private.key"
          PRIVATE_KEY_PATH_2="$RUNNER_TEMP/miniprogram-private-2.key"
          printf '%s' "$MINIPROGRAM_PRIVATE_KEY" > "$PRIVATE_KEY_PATH"
          printf '%s' "$MINIPROGRAM_PRIVATE_KEY_2" > "$PRIVATE_KEY_PATH_2"
          chmod 600 "$PRIVATE_KEY_PATH"
          chmod 600 "$PRIVATE_KEY_PATH_2"
          echo "MINIPROGRAM_PRIVATE_KEY_PATH=$PRIVATE_KEY_PATH" >> "$GITHUB_ENV"
          echo "MINIPROGRAM_PRIVATE_KEY_PATH_2=$PRIVATE_KEY_PATH_2" >> "$GITHUB_ENV"

      - name: 安装依赖
        run: npm ci

      - name: 检查小程序代码
        run: npm run check

      - name: 页面逻辑冒烟测试
        run: npm test

      - name: 生成上传信息
        run: |
          # 版本号取北京时间日期；版本描述取触发本次构建的 main 提交标题，
          # 提交说明里通常就是本次改了什么（squash 合并后即 PR 标题）。
          VERSION="$(date -u --date='+8 hours' '+v%Y.%m.%d')"
          DESC="$(git log -1 --pretty=%s)"
          if [ -z "$DESC" ]; then
            DESC="CI 自动上传于 $(date -u --date='+8 hours' '+%Y/%m/%d %H:%M:%S')"
          fi
          printf 'MINIPROGRAM_VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"
          printf 'MINIPROGRAM_DESC=%s\n' "$DESC" >> "$GITHUB_ENV"

      - name: 写入小程序构建时间
        run: |
          echo "module.exports = { uploadTime: '$(date -u --date='+8 hours' '+%Y/%m/%d %H:%M:%S')' };" > config/build-info.js

      - name: 上传第一个微信小程序代码
        run: npm run upload

      - name: 上传第二个微信小程序代码
        env:
          MINIPROGRAM_APPID: ${{ secrets.WECHAT_MINIPROGRAM_APPID_2 }}
          MINIPROGRAM_PRIVATE_KEY_PATH: ${{ runner.temp }}/miniprogram-private-2.key
        run: npm run upload

      - name: 清理上传私钥
        if: always()
        run: rm -f "$MINIPROGRAM_PRIVATE_KEY_PATH" "$MINIPROGRAM_PRIVATE_KEY_PATH_2"
